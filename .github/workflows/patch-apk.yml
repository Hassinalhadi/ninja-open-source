name: Build & Patch Ninja APK (No LSPosed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional direct URL to orgnail.apk"
        required: false
        default: ""

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Open-Source Mod APK
        run: gradle assembleDebug --no-daemon

      - name: Download Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar

      - name: Prepare orgnail.apk
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            wget -q "${{ github.event.inputs.apk_url }}" -O target.apk
          elif [ -f "orgnail.apk" ]; then
            cp orgnail.apk target.apk
          elif [ -f "original/orgnail.apk" ]; then
            cp original/orgnail.apk target.apk
          else
            echo "No orgnail.apk or apk_url provided; uploading mod-only APK."
            exit 0
          fi

      - name: Decompile Mod & Target APKs
        if: hashFiles('target.apk') != ''
        run: |
          java -jar apktool.jar d app/build/outputs/apk/debug/app-debug.apk -o mod_decoded -f
          java -jar apktool.jar d target.apk -o target_decoded -f

      - name: Inject NinjaMod into Target APK
        if: hashFiles('target.apk') != ''
        run: |
          python3 scripts/patch_apk.py mod_decoded target_decoded

      - name: Rebuild, Zipalign & Sign Patched APK
        if: hashFiles('target.apk') != ''
        run: |
          java -jar apktool.jar b target_decoded -o unsigned.apk
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          "${BUILD_TOOLS_DIR}/zipalign" -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NinjaOpenSource,O=Android,C=US"
          "${BUILD_TOOLS_DIR}/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out samurai-open-source-patched.apk aligned.apk

      - name: Upload Patched APK
        if: hashFiles('samurai-open-source-patched.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: samurai-open-source-patched
          path: samurai-open-source-patched.apk

      - name: Upload Mod APK (Fallback if no orgnail.apk)
        if: hashFiles('samurai-open-source-patched.apk') == ''
        uses: actions/upload-artifact@v4
        with:
          name: ninja-mod-debug
          path: app/build/outputs/apk/debug/app-debug.apk
