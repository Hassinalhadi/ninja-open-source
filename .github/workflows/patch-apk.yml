name: Build & Patch SAMURAI.apk (No LSPosed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional direct URL to SAMURAI.apk"
        required: false
        default: ""

jobs:
  build-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Open-Source Mod APK
        run: gradle assembleDebug --no-daemon

      - name: Download Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar

      - name: Prepare SAMURAI.apk
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            wget -q "${{ github.event.inputs.apk_url }}" -O target.apk
          elif [ -f "SAMURAI.apk" ]; then
            cp SAMURAI.apk target.apk
          elif [ -f "original/SAMURAI.apk" ]; then
            cp original/SAMURAI.apk target.apk
          else
            echo "ERROR: SAMURAI.apk not found in repository root or original/SAMURAI.apk"
            exit 1
          fi

      - name: Decompile Mod & SAMURAI.apk
        run: |
          java -jar apktool.jar d app/build/outputs/apk/debug/app-debug.apk -o mod_decoded -f -r
          java -jar apktool.jar d target.apk -o target_decoded -f -r

      - name: Inject NinjaMod & Redirect Server into SAMURAI.apk
        run: |
          python3 scripts/patch_apk.py mod_decoded target_decoded target.apk

      - name: Rebuild, Zipalign & Sign Patched APK
        run: |
          java -jar apktool.jar b target_decoded -o raw_unsigned.apk
          python3 - << 'PY'
          import zipfile
          with zipfile.ZipFile("raw_unsigned.apk", "r") as zin, \
               zipfile.ZipFile("unsigned.apk", "w") as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  compress = zipfile.ZIP_STORED if (
                      item.filename == "resources.arsc" or item.filename.endswith(".so")
                  ) else zipfile.ZIP_DEFLATED
                  zout.writestr(item, data, compress_type=compress)
          PY
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          "${BUILD_TOOLS_DIR}/zipalign" -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NinjaOpenSource,O=Android,C=US"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out samurai-open-source-patched.apk \
            aligned.apk
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose samurai-open-source-patched.apk

      - name: Upload Patched APK
        uses: actions/upload-artifact@v4
        with:
          name: samurai-open-source-patched
          path: samurai-open-source-patched.apk
